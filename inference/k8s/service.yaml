apiVersion: v1
kind: Service
metadata:
  name: llmmll
  namespace: llmmll
  labels:
    app: llmmll
spec:
  type: LoadBalancer
  selector:
    app: llmmll
  ports:
    - name: api
      port: 11434
      targetPort: 11434
      protocol: TCP
      # nodePort: 30134
    - name: sd
      port: 8000
      targetPort: 8000
      protocol: TCP
      # nodePort: 30080
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
      # nodePort: 30051
  # clusterIP: 10.43.5.10
  publishNotReadyAddresses: true
