apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      runtimeClassName: nvidia
      volumes:
        - name: ollama-models-volume
          persistentVolumeClaim:
            claimName: ollama-models
        - name: init-script
          configMap:
            name: ollama-init-script
            defaultMode: 0755
        # - name: sd-models-volume
        #   persistentVolumeClaim:
        #     claimName: sd-models
        - name: generated-images
          persistentVolumeClaim:
            claimName: generated-images
        - name: code-base
          persistentVolumeClaim:
            claimName: code-base
        # - name: llama-cpp
        #   hostPath:
        #     path: /llama.cpp
        #     type: DirectoryOrCreate
        - name: models
          hostPath:
            path: /models
            type: DirectoryOrCreate
      containers:
        - name: ollama
          image: 192.168.0.71:31500/inference:composer
          imagePullPolicy: Always
          ports:
            - name: ollama
              containerPort: 11434
              protocol: TCP
            - name: sd
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              memory: "24Gi"
              cpu: "16"
              nvidia.com/gpu: "1"
            limits:
              memory: "30Gi"
              cpu: "20"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: ollama-models-volume
              mountPath: /root/.ollama
            # - name: sd-models-volume
            #   mountPath: /root/.cache/huggingface/hub
            - name: init-script
              mountPath: /scripts
            - name: generated-images
              mountPath: /root/images
            - name: code-base
              mountPath: /app
            # - name: llama-cpp
            #   mountPath: /llama.cpp
            - name: models
              mountPath: /models
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            - name: OLLAMA_DEBUG
              value: "false"
            - name: PYTHONPATH
              value: "/app"
            # Logging configuration
            - name: LOG_LEVEL
              value: "debug"
            - name: FORCE_COLOR
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            # RabbitMQ configuration
            - name: RABBITMQ_ENABLED
              value: "true"
            - name: RABBITMQ_HOST
              value: "rabbitmq-0.rabbitmq.rabbitmq.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "lsm"
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: password
            - name: RABBITMQ_VHOST
              value: "/"
            # Internal service settings
            - name: MAISTRO_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: internal-api-key
                  key: api_key
            - name: MAISTRO_BASE_URL
              value: "http://maistro.maistro.svc.cluster.local:8080"

            # Authentication configuration
            - name: AUTH_ISSUER
              value: "https://auth.longstorymedia.com"
            - name: AUTH_AUDIENCE
              value: "lsm-client"
            - name: AUTH_CLIENT_ID
              value: "lsm-client"
            - name: AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-client
                  key: client_secret
            - name: AUTH_JWKS_URI
              value: "https://auth.longstorymedia.com/keys"

            # Database configuration
            - name: DB_HOST
              value: "192.168.0.71"
            - name: DB_PORT
              value: "32345"
            - name: DB_USER
              value: "lsm"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: DB_NAME
              value: "llmmll"
            - name: DB_SSLMODE
              value: "disable"

            # Redis configuration
            - name: REDIS_ENABLED
              value: "true"
            - name: REDIS_HOST
              value: "192.168.0.71"
            - name: REDIS_PORT
              value: "32346"
            - name: REDIS_DB
              value: "0"
            - name: REDIS_CONVERSATION_TTL
              value: "360"
            - name: REDIS_MESSAGE_TTL
              value: "180"
            - name: REDIS_SUMMARY_TTL
              value: "720"
            - name: REDIS_POOL_SIZE
              value: "10"
            - name: REDIS_MIN_IDLE_CONNECTIONS
              value: "2"
            - name: REDIS_CONNECT_TIMEOUT
              value: "5"

            # Summarization configuration
            - name: MESSAGES_BEFORE_SUMMARY
              value: "6"
            - name: SUMMARIES_BEFORE_CONSOLIDATION
              value: "3"
            - name: SUMMARY_MODEL
              value: "qwen3:0.6b"
            - name: SUMMARY_SYSTEM_PROMPT
              value: "compress the following conversation so far into a concise paragraph. Include key points and conclusions, but omit redundant details. The summary will be used as context for future interaction. It should be as small as possible and does not need to be human readable."
            - name: MAX_SUMMARY_LEVELS
              value: "3"
            - name: SUMMARY_WEIGHT_COEFFICIENT
              value: "0.7"
            - name: MASTER_SUMMARY_PROMPT
              value: "Create a comprehensive summary of the conversation, giving most weight to the most recent points and gradually less weight to older information. This is a master summary that will be used for long-term context."

            # Image generation configuration
            - name: IMAGE_GENERATION_ENABLED
              value: "true"
            - name: IMAGE_DIR
              value: "/root/images"
            - name: MAX_IMAGE_SIZE
              value: "2048"
            - name: IMAGE_RETENTION_HOURS
              value: "24"

            # Inference services configuration
            - name: INFERENCE_SERVICES_OLLAMA_BASE_URL
              value: "http://localhost:11434"
            - name: INFERENCE_SERVICES_SD_BASE_URL
              value: "http://localhost:8000"
            - name: INFERENCE_SERVICES_HOST
              value: "0.0.0.0"
            - name: INFERENCE_SERVICES_PORT
              value: "50051"

            # Composer service configuration
            - name: COMPOSER_HOST
              value: "0.0.0.0"
            - name: COMPOSER_PORT
              value: "8001"
            - name: COMPOSER_DEBUG
              value: "false"
            - name: COMPOSER_RELOAD
              value: "false"
            - name: COMPOSER_LOG_LEVEL
              value: "INFO"
            - name: COMPOSER_ENABLE_CORS
              value: "true"
            - name: COMPOSER_RATE_LIMIT_ENABLED
              value: "true"
            - name: COMPOSER_RATE_LIMIT_RPM
              value: "60"
            - name: COMPOSER_HEALTH_CHECK_ENABLED
              value: "true"
            - name: COMPOSER_HEALTH_CHECK_INTERVAL
              value: "30"

            # Composer workflow defaults (user-customizable via UI)
            - name: COMPOSER_ENABLE_CACHE
              value: "true"
            - name: COMPOSER_CACHE_TTL
              value: "3600"
            - name: COMPOSER_MAX_PARALLEL_TOOLS
              value: "5"
            - name: COMPOSER_ENABLE_MULTI_AGENT
              value: "false"
            - name: COMPOSER_DEFAULT_TIMEOUT
              value: "60.0"
            - name: COMPOSER_MAX_CONTEXT_LENGTH
              value: "128000"
            - name: COMPOSER_CONTEXT_TRIM_THRESHOLD
              value: "0.8"
            - name: COMPOSER_ENABLE_STREAMING
              value: "true"
            - name: COMPOSER_STREAM_BUFFER_SIZE
              value: "1024"

            # Composer tool defaults (user-customizable via UI)
            - name: COMPOSER_TOOL_SIMILARITY_THRESHOLD
              value: "0.9"
            - name: COMPOSER_TOOL_MODIFICATION_THRESHOLD
              value: "0.6"
            - name: COMPOSER_ENABLE_TOOL_GENERATION
              value: "true"
            - name: COMPOSER_MAX_TOOL_RETRIES
              value: "3"
            - name: COMPOSER_TOOL_TIMEOUT
              value: "30.0"
            - name: COMPOSER_ENABLE_TOOL_CACHING
              value: "true"
            - name: COMPOSER_TOOL_CACHE_TTL
              value: "1800"
            - name: COMPOSER_ENABLE_SEMANTIC_SEARCH
              value: "true"
            - name: COMPOSER_SEARCH_TOP_K
              value: "10"

            # Internal security configuration
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: internal-api-key
                  key: api_key
            - name: INTERNAL_ALLOWED_IPS
              value: "192.168.0.0/24,10.43.0.0/16"

            # Log level
            - name: LOG_LEVEL
              value: "info"
            # API versioning configurationEL
            - name: API_VERSION
              value: "v1"
            - name: EVALUATION_VENV
              value: "/opt/venv/evaluation"
            - name: SERVER_VENV
              value: "/opt/venv/server"
            - name: RUNNER_VENV
              value: "/opt/venv/runner"
            - name: COMPOSER_VENV
              value: "/opt/venv/composer"
            - name: BASE_VENV
              value: "/opt/venv/base"
            # - name: CMAKE_ARGS
            #   value: "-DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75;86 -DCMAKE_PREFIX_PATH=/llama.cpp/build/bin"
            # - name: LLAMA_CPP_LIB_PATH
            #   value: "/llama.cpp/build/bin"
            - name: LD_LIBRARY_PATH
              value: "/usr/local/lib:/usr/local/cuda/lib64:/opt/venv/runner/lib/python3.12/site-packages/llama_cpp/lib:/opt/venv/server/lib/python3.12/site-packages/llama_cpp/lib:/opt/venv/evaluation/lib/python3.12/site-packages/llama_cpp/lib"

            # CUDA and Memory Optimization Configuration
            # Comprehensive CUDA graphs disabling for stability
            # - name: LLAMA_CUDA_USE_GRAPHS
            #   value: "0"
            # - name: GGML_CUDA_USE_GRAPHS
            #   value: "0"
            # - name: CUDA_USE_GRAPHS
            #   value: "0"
            # - name: LLAMA_GRAPH
            #   value: "0"
            # - name: GGML_GRAPH
            #   value: "0"
            # # Force basic CUBLAS instead of optimized routines
            # - name: LLAMA_CUBLAS
            #   value: "1"
            # - name: GGML_CUDA_FORCE_CUBLAS
            #   value: "1"
            # - name: GGML_CUDA_FORCE_MMQ
            #   value: "0"
            # # Memory management optimizations for 3-GPU setup
            # - name: GGML_CUDA_POOL_SIZE
            #   value: "2147483648" # 2GB pool limit per GPU
            # - name: LLAMA_CUDA_POOL_SIZE
            #   value: "2147483648"
            # - name: CUDA_MEMORY_FRACTION
            #   value: "0.8" # Use max 80% of VRAM per device
            # # Additional CUDA optimizations
            # - name: GGML_USE_CUBLAS
            #   value: "1"
            # - name: GGML_CUDA_NO_PINNED
            #   value: "1"
            - name: CUDA_VISIBLE_DEVICES
              value: "0,1,2" # Explicitly list available devices
            - name: CUDA_DEVICE_ORDER
              value: "PCI_BUS_ID"
            # Python memory optimizations
            - name: PYTHONMALLOC
              value: "malloc"
            - name: MALLOC_ARENA_MAX
              value: "2"
            # Logging configuration for debugging
            - name: GGML_LOG_LEVEL
              value: "2"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"

            # Search API keys configuration
            - name: GOOGLE_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-search-api-key
                  key: google-search-api-key
            - name: GOOGLE_SEARCH_CX
              valueFrom:
                secretKeyRef:
                  name: google-search-cx
                  key: google-search-cx
            - name: BRAVE_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: brave-api-key
                  key: brave-api-key
            - name: SERPER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: serper-api-key
                  key: serper-api-key
            - name: SEARX_HOST
              value: "http://searxng.searxng.svc.cluster.local:8080"

  strategy:
    type: Recreate
