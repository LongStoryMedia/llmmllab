[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "composer"
version = "0.1.0"
description = "LangGraph-based composer service for LLM ML Lab"
authors = [
    {name = "LLM ML Lab", email = "info@llmmllab.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.2",
    "uvicorn>=0.35.0", 
    "pydantic>=2.11.9",
    "python-dotenv>=1.1.1",
    "langchain>=0.3.27",
    "langgraph>=0.6.6",
    "langchain-openai>=0.3.33",
    "langchain-community>=0.3.29",
    "redis>=6.4.0",
    "asyncpg>=0.30.0",
    "faiss-cpu>=1.12.0",
    "prometheus-client>=0.22.1",
    "structlog>=25.4.0",
    "httpx>=0.28.1",
    "websockets>=15.0.1",
    "aiohttp>=3.12.15",
    "tenacity>=9.1.2",
    "sentence-transformers>=5.1.0",
    "numpy>=2.3.3",
    "psutil>=7.0.0",
    "pyjwt[crypto]>=2.10.1",
    "cryptography>=45.0.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pyright>=1.1.0"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3