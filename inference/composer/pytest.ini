[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = test/unit test/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests for individual components
    integration: Integration tests requiring composer services
    workflow: Tests that require workflow composition
    graph: Tests that require LangGraph components
addopts = -v --tb=short --strict-markers
log_cli = true
log_cli_level = INFO
log_file = test-output/pytest.log
log_file_level = DEBUG