[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = test/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: Integration tests for runner
    runner: Tests that require the runner to be running
    pipeline: Tests that require pipeline creation and execution
addopts = -v --tb=short --strict-markers
log_cli = true
log_cli_level = INFO
log_file = test-output/pytest.log
log_file_level = DEBUG