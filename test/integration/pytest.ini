[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = test/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: Integration tests that require multiple services
    database: Tests that require database access
    server: Tests that require the server to be running
    composer: Tests that require the composer to be functional
    runner: Tests that require the runner to be functional
addopts = -v --tb=short --strict-markers
log_cli = true
log_cli_level = INFO
log_file = test-output/pytest.log
log_file_level = DEBUG