$schema: "http://json-schema.org/draft-07/schema#"
type: object
title: PipelineError
description: "Error information from pipeline execution"
properties:
  error_id:
    type: string
    description: "Unique error identifier"
  error_type:
    type: string
    enum:
      ["validation", "execution", "timeout", "resource", "network", "unknown"]
    description: "Category of error"
  error_code:
    type: string
    description: "Specific error code"
  message:
    type: string
    description: "Human-readable error message"
  details:
    type: string
    description: "Detailed error information"
  stack_trace:
    type: string
    description: "Stack trace if applicable"
  context:
    type: object
    description: "Additional context about the error"
    additionalProperties: true
  timestamp:
    type: string
    format: "date-time"
    description: "When error occurred"
  recoverable:
    type: boolean
    description: "Whether the error is recoverable"
required: ["error_id", "error_type", "message", "timestamp"]
additionalProperties: false
