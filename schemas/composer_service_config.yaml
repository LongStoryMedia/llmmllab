$schema: http://json-schema.org/draft-07/schema#
title: ComposerServiceConfig
description: Composer service system configuration (non-user configurable)
type: object
properties:
  host:
    type: string
    description: Service host address
    default: "0.0.0.0"
  port:
    type: integer
    description: Service port
    default: 8001
    minimum: 1024
    maximum: 65535
  debug:
    type: boolean
    description: Enable debug mode
    default: false
  reload:
    type: boolean
    description: Enable auto-reload in development
    default: false
  log_level:
    type: string
    description: Logging level
    enum: ["DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"]
    default: "INFO"
  enable_cors:
    type: boolean
    description: Enable CORS middleware
    default: true
  cors_origins:
    type: array
    items:
      type: string
    description: Allowed CORS origins
    default: ["*"]
  max_request_size:
    type: integer
    description: Maximum request size in bytes
    default: 10485760  # 10MB
    minimum: 1048576   # 1MB
    maximum: 104857600 # 100MB
  rate_limit:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      requests_per_minute:
        type: integer
        default: 60
        minimum: 1
        maximum: 1000
    required:
      - enabled
      - requests_per_minute
  health_check:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      interval_seconds:
        type: integer
        default: 30
        minimum: 5
        maximum: 300
    required:
      - enabled
      - interval_seconds
required:
  - host
  - port
  - debug
  - reload
  - log_level
  - enable_cors
  - cors_origins
  - max_request_size
  - rate_limit
  - health_check
