$schema: http://json-schema.org/draft-07/schema#
title: Model
description: Model represents a machine learning model used for generating responses
type: object
properties:
  id:
    type: string
    description: Unique identifier for the model
  name:
    type: string
    description: Display name of the model
  model:
    type: string
    description: Identifier used to reference the model
  task:
    $ref: "#/definitions/ModelTask"
    description: Type of task the model is designed for (e.g., "TextToText", "TextToImage")
  modified_at:
    type: string
    description: Timestamp of when the model was last modified
  digest:
    type: string
    description: Hash digest identifying the model version
  details:
    $ref: "#/definitions/ModelDetails"
    description: Additional information about the model
  pipeline:
    type: string
    description: Pipeline type used for the model (e.g., "sd3", "sdxl")
  lora_weights:
    type: array
    items:
      $ref: "#/definitions/LoraWeight"
    description: List of LoRA weights associated with the model
  provider:
    $ref: model_provider.yaml
    description: Provider or runtime of the model (e.g., "llama.cpp", "hf", "openai")
  system_prompt:
    type: string
    description: System prompt to use when running this model
  parameters:
    $ref: model_parameters.yaml
    description: Default inference parameters for this model
  gpu_config:
    $ref: gpu_config.yaml
    description: GPU configuration for this model
  image_settings:
    $ref: model_profile_image_settings.yaml
    description: Image generation settings (for image models)
  draft_model:
    type: string
    description: Optional draft model for speculative decoding
required:
  - name
  - model
  - modified_at
  - digest
  - details
  - task
  - provider
definitions:
  ModelDetails:
    $ref: model_details.yaml
  LoraWeight:
    $ref: lora_weight.yaml
  ModelTask:
    $ref: model_task.yaml
  ModelParameters:
    $ref: model_parameters.yaml
  GPUConfig:
    $ref: gpu_config.yaml
  ModelProfileImageSettings:
    $ref: model_profile_image_settings.yaml
