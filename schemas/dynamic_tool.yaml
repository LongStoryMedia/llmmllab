$schema: http://json-schema.org/draft-07/schema#
title: DynamicTool
type: object
description: Schema for DynamicTool object
properties:
  name:
    type: string
    description: The name of the tool
  description:
    type: string
    description: Description of what the tool does
  code:
    type: string
    description: The tool's implementation code
  function_name:
    type: string
    description: The name of the function to be called
  parameters:
    type: object
    additionalProperties:
      type: string
    description: Parameters for the tool with string values
additionalProperties: true
required:
  - name
  - description
  - code
  - function_name