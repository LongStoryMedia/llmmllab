$schema: http://json-schema.org/draft-07/schema#
title: ToolChoice
description: Tool selection that the assistant should honor when executing the item.
oneOf:
  - type: object
    properties:
      type:
        type: string
        enum: [auto]
        description: Model chooses whether to call a tool.
    required: [type]
  - type: object
    properties:
      type:
        type: string
        enum: [any]
        description: Model must call at least one tool.
    required: [type]
  - type: object
    properties:
      type:
        type: string
        enum: [tool]
        description: Force a specific tool.
      name:
        type: string
        description: Name of the tool to call.
    required: [type, name]
  - type: object
    properties:
      type:
        type: string
        enum: [none]
        description: Model must not call any tool.
    required: [type]
